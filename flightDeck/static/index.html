<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="fd-token" content="__TOKEN__">
  <title>FlightDeck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Cpath d='M6 17 26 7l-6 18-4-7z' fill='%2338bdf8'/%3E%3C/svg%3E">
  <script>
    // Aplica el tema antes de pintar para evitar parpadeo (guardado, o el del sistema).
    (function () {
      var t = null;
      try { t = localStorage.getItem("fd-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-bs-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#16233a"/><path d="M6 17 26 7l-6 18-4-7z" fill="#38bdf8"/><path d="M16 18 26 7" stroke="#16233a" stroke-width="1.5" fill="none"/></svg>
      <span class="brand-name">Flight<b>Deck</b></span>
    </div>

    <nav>
      <p class="nav-label">Herramientas</p>
      <button class="nav-item active" data-view="bntag"><i class="bi bi-diagram-3"></i> bnTag</button>
    </nav>

    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Cambiar entre tema claro y oscuro">
      <i class="bi bi-moon-stars i-moon"></i><i class="bi bi-sun i-sun"></i>
      <span id="theme-label">Tema</span>
    </button>
  </aside>

  <main>
    <section id="view-bntag" class="view">
      <header class="page-head">
        <div class="page-icon"><i class="bi bi-diagram-3"></i></div>
        <div>
          <h2>bnTag</h2>
          <p>Compila e importa servicios OSB y SOA al dominio.</p>
        </div>
      </header>

      <div id="env-warnings" class="alert alert-warning warnings" hidden></div>

      <form id="bntag-form" class="fd-card">
        <div class="row g-3 align-items-end">
          <div class="col-12 col-sm-3 col-lg-2">
            <label class="form-label" for="target">Tipo</label>
            <select id="target" class="form-select">
              <option value="osb">OSB</option>
              <option value="soa">SOA</option>
            </select>
          </div>
          <div class="col-12 col-sm-9 col-lg-10">
            <label class="form-label" for="name">Nombre</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-tag"></i></span>
              <input id="name" class="form-control" type="text" autocomplete="off" spellcheck="false" required
                     pattern="[A-Za-z0-9_.\-]+" placeholder="Nombre del OSB / SOA">
            </div>
          </div>
        </div>

        <div class="checks">
          <label data-for="osb"><input type="checkbox" id="project" class="form-check-input"> --project</label>
          <label data-for="osb"><input type="checkbox" id="skipCompile" class="form-check-input"> --skipCompile</label>
          <label data-for="osb soa"><input type="checkbox" id="skipImport" class="form-check-input"> --skipImport</label>
          <label data-for="osb"><input type="checkbox" id="create" class="form-check-input"> --create</label>
          <label data-for="osb"><input type="checkbox" id="rest" class="form-check-input"> --rest</label>
        </div>

        <div class="actions">
          <button type="submit" id="run" class="btn btn-primary"><i class="bi bi-play-fill"></i> Ejecutar</button>
          <button type="button" id="cancel" class="btn btn-outline-secondary" disabled><i class="bi bi-stop-fill"></i> Cancelar</button>
          <span id="status" class="status"></span>
        </div>
      </form>

      <div class="panels">
        <section class="fd-card panel-steps">
          <header class="panel-head"><i class="bi bi-list-check"></i> Pasos</header>
          <ol id="steps" class="steps"></ol>
        </section>
        <section class="fd-card panel-log">
          <header class="panel-head"><i class="bi bi-terminal"></i> Salida</header>
          <pre id="log" class="log" aria-live="polite"></pre>
        </section>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
